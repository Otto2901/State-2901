      fc_level:document.getElementById('edFc').value,
      state_num:document.getElementById('edState').value.trim(),
      alliance:document.getElementById('edAlliance').value,
      invite_type:document.getElementById('edType').value,
      status:document.getElementById('edStatus').value,
      notes:document.getElementById('edNotes').value.trim(),
      updated_by:SESSION.name,
      updated_at:new Date().toISOString()
    };
    var r=await sb.from('transfer_invites').update(updates).eq('id',inv.id).select().single();
    if(r.error){ toast('Error: '+r.error.message); return; }
    var idx=TRANSFER_INVITES.findIndex(function(i){ return i.id===inv.id; });
    if(idx>=0) TRANSFER_INVITES[idx]=r.data;
    toast('✅ Saved!');
    window._trEditing=null;
    TR_TAB='list'; render();
  });

  document.getElementById('edDelete').addEventListener('click',async function(){
    if(!await confirmDanger('Delete the invite for '+inv.player_name+'? This cannot be undone.',{title:'Delete invite',confirmLabel:'Delete'})) return;
    var r=await sb.from('transfer_invites').delete().eq('id',inv.id);
    if(r.error){ toast('Error: '+r.error.message); return; }
    TRANSFER_INVITES=TRANSFER_INVITES.filter(function(i){ return i.id!==inv.id; });
    toast('🗑 Deleted');
    window._trEditing=null;
    TR_TAB='list'; render();
  });

  document.getElementById('edCancel').addEventListener('click',function(){
    window._trEditing=null;
    TR_TAB='list'; render();
  });
}


function renderRotHistory(rc){
  // Get all unique weeks sorted desc
  var weeks=[...new Set(ROT_SELS.map(function(s){ return s.week_start; }))].sort(function(a,b){ return b>a?1:-1; });

  if(weeks.length===0){
    rc.innerHTML='<div class="empty"><div class="empty-icon">📅</div><p>No history yet.<br>Selections will appear here after each week.</p></div>';
    return;
  }

  // Clamp index
  if(ROT_HIST_IDX>=weeks.length) ROT_HIST_IDX=weeks.length-1;
  if(ROT_HIST_IDX<0) ROT_HIST_IDX=0;

  var weekStart=weeks[ROT_HIST_IDX];
  var weekSels=ROT_SELS.filter(function(s){ return s.week_start===weekStart; });
  var weekDate=new Date(weekStart).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  // Build maps
  var takenSH={}, takenFT={};
  weekSels.forEach(function(s){
    if(s.stronghold) takenSH[s.stronghold]=s.alliance;
    if(s.fort) takenFT[s.fort]=s.alliance;
  });

  // Nav buttons
  var navHtml=
    '<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(26,18,10,.6);border:1px solid rgba(196,155,92,.14);border-radius:12px;padding:10px 14px;margin-bottom:12px;">'+
      '<button class="rot-act-btn" id="histPrev" '+(ROT_HIST_IDX<weeks.length-1?'':'disabled')+' style="padding:6px 12px;">← Older</button>'+
      '<div style="text-align:center;">'+
        '<div style="font-size:13px;font-weight:800;color:#f2e6d0;">Week of '+weekDate+'</div>'+
        '<div style="font-size:11px;color:var(--t2);">'+(ROT_HIST_IDX===0?'Most Recent':'Week '+(ROT_HIST_IDX+1)+' ago')+'</div>'+
      '</div>'+
      '<button class="rot-act-btn" id="histNext" '+(ROT_HIST_IDX>0?'':'disabled')+' style="padding:6px 12px;">Newer →</button>'+
    '</div>';

  // Strongholds
  var shHtml='<div style="background:rgba(26,18,10,.6);border:1px solid rgba(196,155,92,.14);border-radius:12px;padding:14px;margin-bottom:12px;">'+
    '<div style="font-size:12px;font-weight:800;color:var(--gold);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">🏰 Strongholds</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">';
  for(var i=1;i<=4;i++){
    var al=takenSH[i];
    var color=al?(ALLIANCE_COLORS[al]||'var(--ac)'):'#6b5a42';
    shHtml+='<div style="background:rgba(18,13,8,.52);border:1px solid rgba(196,155,92,.14);border-left:3px solid var(--gold);border-radius:10px;padding:10px;text-align:center;">'+
      '<div style="font-size:11px;color:var(--t2);margin-bottom:4px;">SH '+i+'</div>'+
      '<div style="font-size:14px;font-weight:800;color:'+color+';">'+(al||'—')+'</div>'+
    '</div>';
  }
  shHtml+='</div></div>';

  // Forts
  var ftHtml='<div style="background:rgba(26,18,10,.6);border:1px solid rgba(196,155,92,.14);border-radius:12px;padding:14px;margin-bottom:12px;">'+
    '<div style="font-size:12px;font-weight:800;color:var(--steel);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">🏯 Forts</div>'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">';
  for(var j=1;j<=12;j++){
    var fal=takenFT[j];
    var fcolor=fal?(ALLIANCE_COLORS[fal]||'var(--ac)'):'var(--green)';
    var fbg=fal?'rgba(18,13,8,.52)':'color-mix(in srgb,var(--green) 6%,transparent)';
    var fborder=fal?'rgba(196,155,92,.14)':'color-mix(in srgb,var(--green) 20%,transparent)';
    ftHtml+='<div style="background:'+fbg+';border:1px solid '+fborder+';border-left:3px solid var(--steel);border-radius:8px;padding:8px;text-align:center;">'+
      '<div style="font-size:10px;color:var(--t2);margin-bottom:3px;">F'+j+'</div>'+
      '<div style="font-size:12px;font-weight:800;color:'+fcolor+'">'+(fal||'FREE')+'</div>'+
    '</div>';
  }
  ftHtml+='</div></div>';

  // Alliance breakdown
  var allRows=weekSels.map(function(s){
    var color=ALLIANCE_COLORS[s.alliance]||'var(--ac)';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(100,160,220,.06);">'+
      '<span style="font-size:13px;font-weight:800;color:'+color+';">'+s.alliance+'</span>'+
      '<span style="font-size:12px;color:var(--t2);">'+
        (s.stronghold?'🏰 SH'+s.stronghold+' · ':'')+
        (s.fort?'🏯 F'+s.fort:'')+
      '</span>'+
    '</div>';
  }).join('');

  var breakdownHtml=weekSels.length?
    '<div style="background:rgba(26,18,10,.6);border:1px solid rgba(196,155,92,.14);border-radius:12px;padding:14px;margin-bottom:12px;">'+
      '<div style="font-size:12px;font-weight:800;color:var(--ac);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">📋 Selections ('+weekSels.length+')</div>'+
      allRows+
    '</div>':'';

  rc.innerHTML=navHtml+shHtml+ftHtml+breakdownHtml;

  document.getElementById('histPrev').addEventListener('click',function(){ ROT_HIST_IDX++; render(); });
  document.getElementById('histNext').addEventListener('click',function(){ ROT_HIST_IDX--; render(); });
}

// CENTRAL ADMIN PANEL
// ═══════════════════════════════════════════════════════
function renderAdminPanel(app){
  var isSuper = isSuperAdmin(SESSION.name);
  var isAlbAdm = false; // albums module removed
  var isMod = isModerator(SESSION.name);
  var isTrMgr = ALLIANCE_REPS.some(function(r){ return r.player_name===SESSION.name&&r.alliance==='TRANSFER'; });
  var isStrAdm = isStrongholdAdmin(SESSION.name);

  // Build tabs based on role
  var tabs=[];
  if(isSuper)              tabs.push({id:'players',icon:'👥',label:'Players'});
  if(isSuper)              tabs.push({id:'roles',icon:'👑',label:'Roles'});

  if(isSuper||isStrAdm)   tabs.push({id:'rotation',icon:'🏰',label:'Rotation'});
  if(isSuper||isTrMgr)    tabs.push({id:'transfer',icon:'✈️',label:'Transfer'});
  if(isSuper)              tabs.push({id:'stats',icon:'📊',label:'Stats'});

  // Ensure ADMIN_TAB is valid
  if(!tabs.find(function(t){ return t.id===ADMIN_TAB; })) ADMIN_TAB=tabs[0]?tabs[0].id:null;

  var navHtml=tabs.map(function(t){
    return '<button class="nav-btn '+(ADMIN_TAB===t.id?'on':'')+'" data-tab="'+t.id+'">'+
      '<span class="ic">'+t.icon+'</span>'+t.label+'</button>';
  }).join('');

  var chipCls=isSuper?'player-chip adm':'player-chip';
  var roleLabel=isSuper?'<span class="role-badge role-super">Super Admin</span>':
    isAlbAdm?'<span class="role-badge role-album">Album Admin</span>':
    isMod?'<span class="role-badge role-mod">Moderator</span>':
    isTrMgr?'<span class="role-badge" style="background:rgba(191,90,242,.15);color:#bf5af2;border:1px solid rgba(191,90,242,.3);">Transfer Mgr</span>':
    isStrAdm?'<span class="role-badge role-svs">Stronghold Admin</span>':'';

  app.innerHTML=
    buildModuleHeader('adminpanel','🏛️','Admin Panel','System Management & Settings')+
    '<div class="content" id="adminContent"></div>'+
    '<div class="footer">© 2026 State 2901 · All rights reserved · Designed by Otto</div>'+
    '<div class="nav">'+navHtml+'</div>';

  document.getElementById('backHome').addEventListener('click',function(){ MODULE=null; render(); });
  app.querySelectorAll('.nav-btn').forEach(function(btn){
    btn.addEventListener('click',function(){ ADMIN_TAB=btn.dataset.tab; render(); });
  });

  var ac=document.getElementById('adminContent');
  if(!ADMIN_TAB){ ac.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><p>Access denied.</p></div>'; return; }
  if(ADMIN_TAB==='players')  renderAdminPlayers(ac);
  if(ADMIN_TAB==='roles')    renderAdminRoles(ac);

  if(ADMIN_TAB==='rotation') renderRotAdmin(ac);
  if(ADMIN_TAB==='transfer') renderTransferAdmin(ac);
  if(ADMIN_TAB==='stats')    renderAdminStats(ac);
}

// ── PLAYERS TAB ──────────────────────────────────────────
function renderAdminPlayers(ac){
  if(!isSuperAdmin(SESSION.name)){
    ac.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><p>Access denied.</p></div>';
    return;
  }
  var pending=ALL_PLAYERS.filter(function(p){ return p.status==='pending'; });
  var approved=ALL_PLAYERS.filter(function(p){ return p.status!=='pending'; });
  var counts={};

  var pendingHtml=pending.length?
    '<div style="background:color-mix(in srgb,var(--orange) 6%,transparent);border:2px solid color-mix(in srgb,var(--orange) 30%,transparent);border-radius:12px;padding:14px;margin-bottom:12px;">'+
      '<div style="font-size:12px;font-weight:800;color:var(--orange);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">⏳ Pending Approvals ('+pending.length+')</div>'+
      pending.map(function(p){
        return '<div style="background:rgba(26,18,10,.6);border-radius:10px;padding:10px;margin-bottom:8px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">'+
            '<div>'+
              '<div style="font-size:13px;font-weight:800;color:#f2e6d0;">'+p.name+'</div>'+
              '<div style="font-size:11px;color:var(--t2);">ID: '+(p.player_id||'—')+' · Alliance: '+(p.alliance||'—')+'</div>'+
            '</div>'+
            '<div style="display:flex;gap:6px;">'+
              '<button class="btn btn-g btn-sm approve-player" data-name="'+p.name+'" style="padding:5px 12px;font-size:11px;">✅ Approve</button>'+
              '<button class="btn btn-d btn-sm reject-player" data-name="'+p.name+'" style="padding:5px 12px;font-size:11px;background:color-mix(in srgb,var(--red) 15%,transparent);border-color:color-mix(in srgb,var(--red) 30%,transparent);color:var(--red);">❌ Reject</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>':'';

  // ID change requests
  var idReqHtml=ID_REQUESTS.filter(function(r){ return r.status==='pending'; }).length?
    '<div style="background:color-mix(in srgb,var(--orange) 6%,transparent);border:2px solid color-mix(in srgb,var(--orange) 30%,transparent);border-radius:12px;padding:14px;margin-bottom:12px;">'+
      '<div style="font-size:12px;font-weight:800;color:var(--orange);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">🔄 ID Change Requests ('+ID_REQUESTS.filter(function(r){ return r.status==='pending'; }).length+')</div>'+
      ID_REQUESTS.filter(function(r){ return r.status==='pending'; }).map(function(req){
        var isName=req.request_type==='name';
        return '<div style="background:rgba(26,18,10,.6);border-radius:10px;padding:10px;margin-bottom:8px;">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">'+
            '<div>'+
              '<div style="font-size:13px;font-weight:800;color:#f2e6d0;">'+req.player_name+'</div>'+
              '<div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:'+(isName?'var(--purple)':'var(--steel)')+';margin:2px 0;">'+(isName?'Name change':'ID change')+'</div>'+
              '<div style="font-size:11px;color:var(--t2);">'+req.old_id+' → <strong style="color:var(--gold);">'+req.new_id+'</strong></div>'+
            '</div>'+
            '<div style="display:flex;gap:6px;">'+
              '<button class="btn btn-g btn-sm approve-id-req" data-id="'+req.id+'" data-player="'+req.player_name+'" data-newid="'+req.new_id+'" data-type="'+(isName?'name':'id')+'" style="padding:5px 12px;font-size:11px;">✅ Approve</button>'+
              '<button class="btn btn-d btn-sm reject-id-req" data-id="'+req.id+'" style="padding:5px 12px;font-size:11px;background:color-mix(in srgb,var(--red) 15%,transparent);border-color:color-mix(in srgb,var(--red) 30%,transparent);color:var(--red);">❌ Reject</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>':'';

  // Group approved players by alliance
  var groups = {};
  approved.forEach(function(p){
    var key = p.alliance || '__none__';
    if(!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  var sortedGroups = Object.keys(groups).sort(function(a,b){
    if(a==='__none__') return 1;
    if(b==='__none__') return -1;
    return a.localeCompare(b);
  });

  var SEL=window._playerBulkSel||(window._playerBulkSel=new Set());

  function playerRowHtml(p){
    var role=getRole(p.name);
    var roleTag=role?'<span class="role-badge '+(role==="super_admin"?"role-super":(role==="library_admin"||role==="stronghold_admin"||role==="war_admin"||role==="rally_admin")?"role-svs":"role-mod")+'" style="font-size:9px;">'+role.replace(/_/g," ")+'</span>':'';
    var playerReps=ALLIANCE_REPS.filter(function(r){ return r.player_name===p.name; });
    var repTags=playerReps.map(function(r){
      if(r.alliance==='TRANSFER') return '<span style="font-size:9px;background:rgba(143,122,168,.12);color:#b494c4;border:1px solid rgba(143,122,168,.35);border-radius:5px;padding:1px 5px;">✈️ Transfer Rep</span>';
      return '<span style="font-size:9px;background:rgba(201,151,75,.1);color:#d9ab5c;border:1px solid rgba(201,151,75,.28);border-radius:5px;padding:1px 5px;">Rep: '+r.alliance+'</span>';
    }).join(' ');
    var dupId=p.player_id&&approved.filter(function(x){ return x.player_id===p.player_id; }).length>1;
    return '<div style="'+(dupId?'background:rgba(181,85,74,.06);':'')+';border-radius:8px;padding:9px 6px;border-bottom:1px solid rgba(196,155,92,.06);">'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
        '<input type="checkbox" class="bulk-sel-cb" data-player="'+p.name+'" style="width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--red);" '+(SEL.has(p.name)?'checked':'')+'>'+
        '<div style="flex:1;min-width:0;">'+
          '<div style="font-size:13px;font-weight:700;color:#f2e6d0;display:flex;align-items:center;gap:4px;flex-wrap:wrap;">'+
            p.name+' '+roleTag+' '+repTags+
            (dupId?'<span style="font-size:9px;background:rgba(181,85,74,.18);color:#b5554a;border:1px solid rgba(181,85,74,.35);border-radius:5px;padding:1px 5px;">⚠️ Dup ID</span>':'')+
          '</div>'+
          '<div style="font-size:11px;color:rgba(230,213,180,.45);margin-top:3px;">'+
            (p.player_id?'<span style="font-family:var(--mono);color:#e3bc6a;">'+p.player_id+'</span>':'<span style="color:#b5554a;">No ID</span>')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;gap:4px;flex-shrink:0;">'+
          '<button class="btn btn-d btn-sm reset-pin" data-player="'+p.name+'" title="Reset PIN" style="padding:4px 8px;font-size:11px;">🔑</button>'+
          '<button class="btn btn-d btn-sm del-account" data-player="'+p.name+'" title="Delete" style="padding:4px 8px;font-size:11px;">🗑</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  var approvedHtml = sortedGroups.map(function(key){
    var list = groups[key];
    var label = key==='__none__' ? '🌐 Others ('+list.length+')' : '🏳️ '+key+' ('+list.length+')';
    return '<div class="card" style="margin-bottom:10px;">'+
      '<div style="font-size:11px;font-weight:700;color:rgba(230,213,180,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">'+label+'</div>'+
      list.map(playerRowHtml).join('')+
    '</div>';
  }).join('');

  ac.innerHTML=idReqHtml+pendingHtml+
    '<div style="font-size:12px;font-weight:700;color:rgba(230,213,180,.65);margin-bottom:8px;">✅ Approved Players ('+approved.length+')</div>'+
    '<div style="position:relative;margin-bottom:12px;">'+
      '<input class="inp" id="playerSearch" placeholder="🔍  Search by name, ID or alliance..." style="padding-left:14px;" autocomplete="off">'+
    '</div>'+
    '<div id="bulkActionBar" style="display:none;align-items:center;justify-content:space-between;gap:8px;background:rgba(181,85,74,.1);border:1px solid rgba(181,85,74,.3);border-radius:10px;padding:8px 12px;margin-bottom:10px;">'+
      '<span id="bulkSelCount" style="font-size:12px;font-weight:700;color:#f2e6d0;"></span>'+
      '<div style="display:flex;gap:6px;">'+
        '<button class="btn btn-d btn-sm" id="bulkDeleteBtn" style="padding:5px 10px;font-size:11px;">🗑 Delete Selected</button>'+
        '<button class="btn btn-sm" id="bulkClearBtn" style="padding:5px 10px;font-size:11px;">Clear Selection</button>'+
      '</div>'+
    '</div>'+
    '<div id="playerGroupsWrap">'+approvedHtml+'</div>';

  function updateBulkBar(){
    var bar=document.getElementById('bulkActionBar');
    var cnt=document.getElementById('bulkSelCount');
    if(SEL.size>0){ bar.style.display='flex'; cnt.textContent=SEL.size+' selected'; }
    else bar.style.display='none';
  }
  updateBulkBar();
  ac.querySelectorAll('.bulk-sel-cb').forEach(function(cb){
    cb.addEventListener('change',function(){
      if(cb.checked) SEL.add(cb.dataset.player); else SEL.delete(cb.dataset.player);
      updateBulkBar();
    });
  });
  var bulkClearBtn=document.getElementById('bulkClearBtn');
  if(bulkClearBtn) bulkClearBtn.addEventListener('click',function(){
    SEL.clear();
    ac.querySelectorAll('.bulk-sel-cb').forEach(function(cb){ cb.checked=false; });
    updateBulkBar();
  });
  var bulkDeleteBtn=document.getElementById('bulkDeleteBtn');
  if(bulkDeleteBtn) bulkDeleteBtn.addEventListener('click',async function(){
    var names=Array.from(SEL);
    if(!names.length) return;
    if(!await confirmDanger(names.length+' player account(s) will be permanently deleted:\n\n'+names.join(', '),{title:'Delete '+names.length+' players',confirmLabel:'Delete players',requireTyped:'DELETE'})) return;
    bulkDeleteBtn.disabled=true;
    var okCount=0, failCount=0;
    for(var i=0;i<names.length;i++){
      var pl=names[i];
      var r1=await sb.from('admin_roles').delete().eq('player_name',pl);
      if(r1.error){ failCount++; continue; }
      ADMIN_ROLES=ADMIN_ROLES.filter(function(x){ return x.player_name!==pl; });
      var r2=await sb.from('alliance_reps').delete().eq('player_name',pl);
      if(r2.error){ failCount++; continue; }
      ALLIANCE_REPS=ALLIANCE_REPS.filter(function(x){ return x.player_name!==pl; });
      var r5=await sb.from('id_change_requests').delete().eq('player_name',pl);
      if(r5.error){ failCount++; continue; }
      ID_REQUESTS=ID_REQUESTS.filter(function(x){ return x.player_name!==pl; });
      var r6=await sb.from('push_subscriptions').delete().eq('player_name',pl);
      if(r6.error){ failCount++; continue; }
      var r7=await sb.from('war_team_members').delete().eq('player_name',pl);
      if(r7.error){ failCount++; continue; }
      WAR_MEMBERS=WAR_MEMBERS.filter(function(x){ return x.player_name!==pl; });
      var r8=await sb.from('cj_team_members').delete().eq('player_name',pl);
      if(r8.error){ failCount++; continue; }
      CJ_MEMBERS=CJ_MEMBERS.filter(function(x){ return x.player_name!==pl; });
      var r3=await sb.from('players').delete().eq('name',pl);
      if(r3.error){ failCount++; continue; }
      ALL_PLAYERS=ALL_PLAYERS.filter(function(p){ return p.name!==pl; });
      okCount++;
    }
    SEL.clear();
    toast(okCount+' deleted'+(failCount?', '+failCount+' failed':''));
    render();
  });

  // Live search filter
  var searchInp=ac.querySelector('#playerSearch');
  if(searchInp) searchInp.addEventListener('input',function(){
    var q=searchInp.value.trim().toLowerCase();
    ac.querySelectorAll('#playerGroupsWrap .card').forEach(function(card){
      var rows=card.querySelectorAll('[data-player]');
      // also check card title text
      var anyMatch=false;
      // Search within player rows
      card.querySelectorAll('div[style*="border-bottom"]').forEach(function(row){
        var txt=row.textContent.toLowerCase();
        var match=!q||txt.includes(q);
        row.style.display=match?'':'none';
        if(match) anyMatch=true;
      });
      // If group title matches, show all
      var groupTitle=card.querySelector('div[style*="text-transform"]');
      if(groupTitle&&groupTitle.textContent.toLowerCase().includes(q)){
        card.querySelectorAll('div[style*="border-bottom"]').forEach(function(r){ r.style.display=''; });
        anyMatch=true;
      }
      card.style.display=(anyMatch||!q)?'':'none';
    });
  });

  // Approve/Reject ID requests
  ac.querySelectorAll('.approve-id-req').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var player=btn.dataset.player; var newId=btn.dataset.newid; var reqType=btn.dataset.type||'id';
      if(reqType==='name'){
        // Name change - update all tables
        var r1=await sb.from('players').update({name:newId}).eq('name',player);
        if(r1.error){ toast('Error: '+r1.error.message); return; }
        var r2=await sb.from('alliance_reps').update({player_name:newId}).eq('player_name',player);
        if(r2.error){ toast('Error: '+r2.error.message); return; }
        var r3=await sb.from('admin_roles').update({player_name:newId}).eq('player_name',player);
        if(r3.error){ toast('Error: '+r3.error.message); return; }
        var r7=await sb.from('push_subscriptions').update({player_name:newId}).eq('player_name',player);
        if(r7.error){ toast('Error: '+r7.error.message); return; }
        var r8=await sb.from('war_team_members').update({player_name:newId}).eq('player_name',player);
        if(r8.error){ toast('Error: '+r8.error.message); return; }
        var r9=await sb.from('cj_team_members').update({player_name:newId}).eq('player_name',player);
        if(r9.error){ toast('Error: '+r9.error.message); return; }
        var p=ALL_PLAYERS.find(function(x){ return x.name===player; });
        if(p) p.name=newId;
        ALLIANCE_REPS.forEach(function(r){ if(r.player_name===player) r.player_name=newId; });
        ADMIN_ROLES.forEach(function(r){ if(r.player_name===player) r.player_name=newId; });
        WAR_MEMBERS.forEach(function(m){ if(m.player_name===player) m.player_name=newId; });
        CJ_MEMBERS.forEach(function(m){ if(m.player_name===player) m.player_name=newId; });
        if(SESSION.name===player){ SESSION.name=newId; localStorage.setItem('wos-session',JSON.stringify(SESSION)); }
        toast('✅ Name changed: '+player+' → '+newId);
      } else {
        var r5=await sb.from('players').update({player_id:newId}).eq('name',player);
        if(r5.error){ toast('Error: '+r5.error.message); return; }
        var p2=ALL_PLAYERS.find(function(x){ return x.name===player; });
        if(p2) p2.player_id=newId;
        toast('✅ ID updated for '+player);
      }
      var r6=await sb.from('id_change_requests').update({status:'approved',reviewed_by:SESSION.name,reviewed_at:new Date().toISOString()}).eq('id',btn.dataset.id);
      if(r6.error){ toast('Error: '+r6.error.message); return; }
      ID_REQUESTS=ID_REQUESTS.filter(function(r){ return r.id!==btn.dataset.id; });
      render();
    });
  });
  ac.querySelectorAll('.reject-id-req').forEach(function(btn){
    btn.addEventListener('click',async function(){
      if(!await confirmDanger('Reject this ID change request?',{title:'Reject request',confirmLabel:'Reject'})) return;
      var r=await sb.from('id_change_requests').update({status:'rejected',reviewed_by:SESSION.name,reviewed_at:new Date().toISOString()}).eq('id',btn.dataset.id);
      if(r.error){ toast('Error: '+r.error.message); return; }
      ID_REQUESTS=ID_REQUESTS.filter(function(r){ return r.id!==btn.dataset.id; });
      toast('❌ Request rejected'); render();
    });
  });

  // Approve
  ac.querySelectorAll('.approve-player').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var name=btn.dataset.name;
      var r=await sb.from('players').update({status:'approved'}).eq('name',name);
      if(r.error){ toast('Error: '+r.error.message); return; }
      ALL_PLAYERS=ALL_PLAYERS.map(function(p){ return p.name===name?Object.assign({},p,{status:'approved'}):p; });
      toast('✅ '+name+' approved!'); render();
    });
  });
  // Reject
  ac.querySelectorAll('.reject-player').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var name=btn.dataset.name;
      if(!await confirmDanger('Reject and delete the pending account for '+name+'?',{title:'Reject account',confirmLabel:'Reject & delete'})) return;
      var r=await sb.from('players').delete().eq('name',name);
      if(r.error){ toast('Error: '+r.error.message); return; }
      ALL_PLAYERS=ALL_PLAYERS.filter(function(p){ return p.name!==name; });
      toast('❌ Rejected'); render();
    });
  });
  // Reset PIN
  ac.querySelectorAll('.reset-pin').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var pl=btn.dataset.player;
      var newPin=await promptText('Set a new PIN for '+pl,{title:'Reset PIN',placeholder:'6 digits',confirmLabel:'Set PIN'});
      if(newPin===null) return;
      if(!/^\d{6}$/.test(newPin)){ toast('PIN must be exactly 6 digits'); return; }
      var r=await sb.from('players').update({pin:newPin}).eq('name',pl);
      if(r.error){ toast('Error: '+r.error.message); return; }
      toast('🔑 PIN reset for '+pl);
    });
  });

  // Delete account
  ac.querySelectorAll('.del-account').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var pl=btn.dataset.player;
      if(!await confirmDanger('Permanently delete the account for '+pl+' and remove them from every team, role and rep list?',{title:'Delete account',confirmLabel:'Delete account',requireTyped:'DELETE'})) return;
      var r1=await sb.from('admin_roles').delete().eq('player_name',pl);
      if(r1.error){ toast('Error: '+r1.error.message); return; }
      ADMIN_ROLES=ADMIN_ROLES.filter(function(x){ return x.player_name!==pl; });
      var r2=await sb.from('alliance_reps').delete().eq('player_name',pl);
      if(r2.error){ toast('Error: '+r2.error.message); return; }
      ALLIANCE_REPS=ALLIANCE_REPS.filter(function(x){ return x.player_name!==pl; });
      var r5=await sb.from('id_change_requests').delete().eq('player_name',pl);
      if(r5.error){ toast('Error: '+r5.error.message); return; }
      ID_REQUESTS=ID_REQUESTS.filter(function(x){ return x.player_name!==pl; });
      var r6=await sb.from('push_subscriptions').delete().eq('player_name',pl);
      if(r6.error){ toast('Error: '+r6.error.message); return; }
      var r7=await sb.from('war_team_members').delete().eq('player_name',pl);
      if(r7.error){ toast('Error: '+r7.error.message); return; }
      WAR_MEMBERS=WAR_MEMBERS.filter(function(x){ return x.player_name!==pl; });
      var r8=await sb.from('cj_team_members').delete().eq('player_name',pl);
      if(r8.error){ toast('Error: '+r8.error.message); return; }
      CJ_MEMBERS=CJ_MEMBERS.filter(function(x){ return x.player_name!==pl; });
      var r3=await sb.from('players').delete().eq('name',pl);
      if(r3.error){ toast('Error: '+r3.error.message); return; }
      ALL_PLAYERS=ALL_PLAYERS.filter(function(p){ return p.name!==pl; });
      toast(pl+' deleted'); render();
    });
  });
}

function renderAdminRoles(ac){
  if(!isSuperAdmin(SESSION.name)){
    ac.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><p>Access denied.</p></div>';
    return;
  }
  // Group by player name
  var byPlayer={};
  ADMIN_ROLES.filter(function(r){ return r.player_name!==ADMIN_NAME; }).forEach(function(r){
    if(!byPlayer[r.player_name]) byPlayer[r.player_name]=[];
    byPlayer[r.player_name].push(r);
  });
  var rolesHtml=Object.keys(byPlayer).sort().map(function(pname){
    var roles=byPlayer[pname];
    var badgesHtml=roles.map(function(r){
      var badgeCls=r.role==='cj_admin'||r.role==='library_admin'||r.role==='stronghold_admin'||r.role==='war_admin'||r.role==='rally_admin'?'role-svs':r.role==='album_admin'?'role-album':'role-mod';
      return '<span class="role-badge '+badgeCls+'" style="margin-right:4px;">'+r.role.replace(/_/g," ")+'</span>'+
        '<button class="btn btn-d btn-sm revoke-role" data-player="'+pname+'" data-role="'+r.role+'" style="padding:3px 8px;font-size:10px;margin-right:4px;">✕</button>';
    }).join('');
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(100,160,220,.07);">'+
      '<div>'+
        '<div style="font-size:13px;font-weight:700;color:#c9b48a;margin-bottom:4px;">'+pname+'</div>'+
        '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px;">'+badgesHtml+'</div>'+
      '</div>'+
    '</div>';
  }).join('')||'<div style="color:#6b5a42;font-size:12px;padding:8px 0;">No roles assigned yet</div>';

  ac.innerHTML=
    '<div style="background:color-mix(in srgb,var(--gold) 4%,transparent);border:1px solid color-mix(in srgb,var(--gold) 13%,transparent);border-radius:12px;padding:14px;margin-bottom:12px;">'+
      '<div style="font-size:12px;font-weight:800;color:var(--gold);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;">👑 Admin Roles</div>'+
      '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">'+
        '<div style="flex:1;min-width:120px;">'+
          '<input class="inp" id="rolePlayerSearch" placeholder="🔍 Name or ID..." autocomplete="off" style="margin-bottom:4px;">'+
          '<select class="sel" id="rolePlayer">'+
            groupedPlayerOpts(ALL_PLAYERS, ADMIN_NAME)+
          '</select>'+
        '</div>'+
        '<select class="sel" id="roleSelect" style="flex:1;min-width:120px;"><option value="">— Select role —</option>'+
          '<option value="cj_admin">🤪 Crazy Joe Admin</option>'+
          '<option value="moderator">🛡️ Moderator</option>'+
          '<option value="library_admin">📚 Library Admin</option>'+
          '<option value="stronghold_admin">🏯 Stronghold Admin</option>'+
          '<option value="war_admin">⚔️ War Team Admin</option>'+
          '<option value="rally_admin">⏱️ Rally Timer Admin</option>'+
        '</select>'+
        '<button class="btn btn-g btn-sm" id="grantRoleBtn">Grant</button>'+
      '</div>'+
      rolesHtml+
    '</div>';

  var roleSearch=document.getElementById('rolePlayerSearch');
  if(roleSearch) roleSearch.addEventListener('input',function(){
    var q=roleSearch.value.trim().toLowerCase();
    var sel=document.getElementById('rolePlayer');
    Array.from(sel.options).forEach(function(opt){
      if(!opt.value){ opt.style.display=''; return; }
      var player=ALL_PLAYERS.find(function(p){ return p.name===opt.value; });
      var match=opt.value.toLowerCase().includes(q)||(player&&player.player_id&&player.player_id.toLowerCase().includes(q));
      opt.style.display=match||!q?'':'none';
    });
  });

  document.getElementById('grantRoleBtn').addEventListener('click',function(){
    var p=document.getElementById('rolePlayer').value;
    var r=document.getElementById('roleSelect').value;
    if(p&&r) grantRole(p,r);
  });
  ac.querySelectorAll('.revoke-role').forEach(function(btn){
    btn.addEventListener('click',function(){
      var p=btn.dataset.player, r=btn.dataset.role;
      confirmDanger('Revoke the "'+r.replace(/_/g,' ')+'" role from '+p+'?',{title:'Revoke role',confirmLabel:'Revoke'}).then(function(ok){ if(ok) revokeRole(p,r); });
    });
  });
}

function renderAdminStats(ac){
  if(!isSuperAdmin(SESSION.name)){

function simpleMarkdown(md){
  if(!md) return '';
  var lines = md.split('\n');
  var html = '';
  var inUl = false, inOl = false;
  for(var i=0;i<lines.length;i++){
    var l = lines[i];
    // Close lists if needed
    if(inUl && !/^\s*[-*]\s/.test(l)){ html+='</ul>'; inUl=false; }
    if(inOl && !/^\s*\d+\.\s/.test(l)){ html+='</ol>'; inOl=false; }

    if(/^###\s/.test(l)){       html+='<h3>'+inlineFormat(l.replace(/^###\s/,''))+'</h3>'; }
    else if(/^##\s/.test(l)){   html+='<h2>'+inlineFormat(l.replace(/^##\s/,''))+'</h2>'; }
    else if(/^#\s/.test(l)){    html+='<h1>'+inlineFormat(l.replace(/^#\s/,''))+'</h1>'; }
    else if(/^---+$/.test(l.trim())){ html+='<hr>'; }
    else if(/^>\s/.test(l)){    html+='<blockquote>'+inlineFormat(l.replace(/^>\s/,''))+'</blockquote>'; }
    else if(/^\s*[-*]\s/.test(l)){
      if(!inUl){ html+='<ul>'; inUl=true; }
      html+='<li>'+inlineFormat(l.replace(/^\s*[-*]\s/,''))+'</li>';
    }
    else if(/^\s*\d+\.\s/.test(l)){
      if(!inOl){ html+='<ol>'; inOl=true; }
      html+='<li>'+inlineFormat(l.replace(/^\s*\d+\.\s/,''))+'</li>';
    }
    else if(l.trim()===''){     html+='<p style="margin:4px 0;"></p>'; }
    else{                        html+='<p>'+inlineFormat(l)+'</p>'; }
  }
  if(inUl) html+='</ul>';
  if(inOl) html+='</ol>';
  return html;
}

function inlineFormat(t){
  t = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t = t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g,'<em>$1</em>');
  t = t.replace(/__(.+?)__/g,'<strong>$1</strong>');
  t = t.replace(/_(.+?)_/g,'<em>$1</em>');
  return t;
}

        '<div style="font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Markdown Preview</div>'+
        '<div class="rules-md" id="rulesMdPreview" style="font-size:12px;">'+simpleMarkdown(RULES_EDIT.content||'')+'</div>'+

  var contentTa = document.getElementById('rulesContent');

      RULES_TOPICS.sort(function(x,y){ return x.order_index-y.order_index; });
      renderRulesContent();
    });
  });
  el.querySelectorAll('[data-move-dn]').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var idx=RULES_TOPICS.findIndex(function(x){ return x.id===btn.dataset.moveDn; });

      RULES_TOPICS.sort(function(x,y){ return x.order_index-y.order_index; });
      renderRulesContent();
    });
  });
}

    renderLibraryContent();
  });
  var moveDnBtn=document.getElementById('libraryMoveDnBtn');
  if(moveDnBtn) moveDnBtn.addEventListener('click',async function(){
    var a=LIBRARY_ENTRIES[idx],b=LIBRARY_ENTRIES[idx+1];
    var tmpO=a.order_index; a.order_index=b.order_index; b.order_index=tmpO;
    var r1=await sb.from('library_entries').update({order_index:a.order_index}).eq('id',a.id);
    var r2=await sb.from('library_entries').update({order_index:b.order_index}).eq('id',b.id);
    if(r1.error||r2.error){ toast('Error: '+(r1.error||r2.error).message); }
    LIBRARY_ENTRIES.sort(function(x,y){ return x.order_index-y.order_index; });
    renderLibraryContent();
  });
}

function renderLibraryForm(el){

      '<div style="font-size:12px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;">'+

      '</div>'+
      '<div class="field">'+
        '<label class="lbl">Emoji</label>'+
        '<input class="inp" id="libraryEmoji" value="'+(e.emoji||'📌')+'" placeholder="📌" style="font-size:22px;max-width:80px;">'+
      '</div>'+
      '<div class="field">'+
        '<label class="lbl">Title</label>'+
        '<input class="inp" id="libraryTitle" value="'+(e.title?escHtml(e.title):'')+'" placeholder="e.g. Event Announcement">'+
      '</div>'+
      '<div class="field">'+
        '<label class="lbl">Short Description (optional)</label>'+
        '<input class="inp" id="libraryDesc" value="'+(e.description?escHtml(e.description):'')+'" placeholder="One-line summary">'+
      '</div>'+
      '<div class="field">'+
        '<label class="lbl">Content (Markdown)</label>'+
        '<textarea class="inp" id="libraryContentField" rows="10" style="resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6;" placeholder="# Title&#10;&#10;## Section&#10;&#10;- Item 1&#10;- Item 2">'+(e.content?e.content.replace(/</g,'&lt;'):'')+'</textarea>'+
      '</div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button class="btn btn-p" id="librarySaveBtn" style="flex:1;">'+(isNew?'Add Entry':'Save Changes')+'</button>'+
        '<button class="btn btn-g btn-sm" id="libraryCancelBtn" style="width:auto;padding:13px 18px;">Cancel</button>'+
      '</div>'+
      (e.id?'<div style="margin-top:10px;">'+
        '<div style="height:1px;background:var(--b);margin-bottom:10px;"></div>'+
        '<div style="font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Markdown Preview</div>'+
        '<div class="rules-md" id="libraryMdPreview" style="font-size:12px;">'+simpleMarkdown(e.content||'')+'</div>'+
      '</div>':'')+
    '</div>';

  document.getElementById('libraryCancelBtn').addEventListener('click',function(){ LIBRARY_EDIT=undefined; renderLibraryContent(); });

  var contentTa = document.getElementById('libraryContentField');
  var previewEl = document.getElementById('libraryMdPreview');
  if(contentTa && previewEl){
    contentTa.addEventListener('input',function(){ previewEl.innerHTML=simpleMarkdown(contentTa.value); });
  }

  document.getElementById('librarySaveBtn').addEventListener('click',async function(){
    var emoji = (document.getElementById('libraryEmoji').value.trim()||'📌');
    var title = document.getElementById('libraryTitle').value.trim();
    var desc  = document.getElementById('libraryDesc').value.trim();
    var content = document.getElementById('libraryContentField').value;
    if(!title){ toast('⚠️ Title required'); return; }
    var saveBtn=document.getElementById('librarySaveBtn');
    saveBtn.disabled=true; saveBtn.textContent='Saving...';
    if(LIBRARY_EDIT&&LIBRARY_EDIT.id){
      var r=await sb.from('library_entries').update({emoji,title,description:desc,content}).eq('id',LIBRARY_EDIT.id).select().single();
      if(r.error){ toast('Error: '+r.error.message); saveBtn.disabled=false; saveBtn.textContent='Save Changes'; return; }
      LIBRARY_ENTRIES=LIBRARY_ENTRIES.map(function(x){ return x.id===r.data.id?r.data:x; });
      LIBRARY_SELECTED=r.data;
    } else {
      var maxOrder = LIBRARY_ENTRIES.length ? Math.max.apply(null,LIBRARY_ENTRIES.map(function(x){ return x.order_index||0; }))+1 : 0;
      var r=await sb.from('library_entries').insert({emoji,title,description:desc,content,order_index:maxOrder}).select().single();
      if(r.error){ toast('Error: '+r.error.message); saveBtn.disabled=false; saveBtn.textContent='Add Entry'; return; }
      LIBRARY_ENTRIES.push(r.data);
      LIBRARY_SELECTED=null;
    }
    LIBRARY_EDIT=undefined; toast('✅ Saved!'); renderLibraryContent();
  });
}

function renderCrazyJoeApp(app){
  var isSuper = isSuperAdmin(SESSION.name);
  var isCjAdm = isCjAdmin(SESSION.name);
  var myPlayer = ALL_PLAYERS.find(function(p){ return p.name===SESSION.name; });

    app.innerHTML=
      buildModuleHeader('crazyjoe','🤪','Crazy Joe','Team Assignments')+
      '<div class="empty"><div class="empty-icon">⚠️</div><p>Please set your Alliance in your profile before accessing this module.</p></div>';
    document.getElementById('backHome').addEventListener('click',function(){ MODULE=null; render(); });
    return;
  }

  // Super admin: alliance picker (view all or filter)
  var viewAlliance = isSuper ? (CJ_VIEW_ALLIANCE||'__all__') : myAlliance;

    '<div class="content" id="cjContent"></div>'+
    '<div class="footer">© 2026 State 2901 · All rights reserved · Designed by Otto</div>'+
    '<div class="nav">'+navHtml+'</div>';

  document.getElementById('backHome').addEventListener('click',function(){ MODULE=null; render(); });
  app.querySelectorAll('.nav-btn').forEach(function(btn){
    btn.addEventListener('click',function(){

function getCjAllianceFilter(isSuper, viewAlliance, myAlliance){
  if(isSuper && viewAlliance && viewAlliance!=='__all__') return viewAlliance;
  if(isSuper && (!viewAlliance||viewAlliance==='__all__')) return null; // all
  return myAlliance;
}

function renderCjBoard(el, viewAlliance, isSuper, isCjAdm, myAlliance){
  // Alliance selector for super admin
  var allianceFilter = getCjAllianceFilter(isSuper, viewAlliance, myAlliance);

  var alliances = [];
  if(isSuper){
    alliances = [...new Set(CJ_TEAMS.map(function(t){ return t.alliance; }))].sort();
  }

  var superAlliancePicker = '';
  if(isSuper){
    var alOpts = '<option value="__all__"'+(CJ_VIEW_ALLIANCE===null||CJ_VIEW_ALLIANCE==='__all__'?' selected':'')+'>All Alliances</option>'+
      alliances.map(function(al){
        return '<option value="'+al+'"'+(CJ_VIEW_ALLIANCE===al?' selected':'')+'>'+al+'</option>';
      }).join('');
    superAlliancePicker =
      '<div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;">'+
        '<label style="font-size:11px;font-weight:700;color:rgba(230,213,180,.5);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;">View Alliance</label>'+
        '<select class="sel" id="cjAllianceSel" style="flex:1;">'+alOpts+'</select>'+
      '</div>';
  }

  // Filter teams
  var teams = allianceFilter
    ? CJ_TEAMS.filter(function(t){ return t.alliance===allianceFilter; })
    : CJ_TEAMS;

  if(!teams.length && !isSuper){
    el.innerHTML = superAlliancePicker +
      '<div class="empty"><div class="empty-icon">👥</div><p>No teams set up yet.<br>Your alliance admin will configure the teams.</p></div>';
    return;
  }
  if(!teams.length && isSuper){
    el.innerHTML = superAlliancePicker +
      '<div class="empty"><div class="empty-icon">👥</div><p>No teams found'+(allianceFilter?' for '+allianceFilter:'')+'.</p></div>';
    var alSel=el.querySelector('#cjAllianceSel');
    if(alSel) alSel.addEventListener('change',function(){ CJ_VIEW_ALLIANCE=this.value==='__all__'?null:this.value; render(); });
    return;
  }

  // Group by alliance if showing all
  var grouped = {};
  teams.forEach(function(t){
    if(!grouped[t.alliance]) grouped[t.alliance]=[];
    grouped[t.alliance].push(t);
  });

  var alKeys = Object.keys(grouped).sort();

  var html = superAlliancePicker;

  alKeys.forEach(function(al){
    var alTeams = grouped[al];
    if(alKeys.length>1){
      html += '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:rgba(230,213,180,.45);margin-bottom:8px;margin-top:4px;">'+al+'</div>';
    }

    // Copy all teams button (admin only)
    if(isCjAdm && (isSuper || al===myAlliance)){
      html += '<button class="btn btn-g btn-sm" id="cjCopyAll_'+al+'" style="margin-bottom:10px;width:100%;">📋 Copy All Teams</button>';
    }

    alTeams.forEach(function(team){
      var members = CJ_MEMBERS.filter(function(m){ return m.team_id===team.id; })
        .sort(function(a,b){ return a.position-b.position; });
      var memberCount = members.length;
      var countColor = memberCount>=6?'var(--green)':memberCount===0?'var(--t3)':'var(--orange)';

      html +=
        '<div class="card" style="margin-bottom:12px;">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'+
            '<div style="font-size:14px;font-weight:800;color:var(--t);">'+escHtml(team.team_name)+'</div>'+
            '<div style="display:flex;align-items:center;gap:8px;">'+
              '<span style="font-size:12px;font-weight:700;color:'+countColor+';">'+memberCount+'/6</span>'+
              (isCjAdm&&(isSuper||al===myAlliance)?
                '<button class="btn btn-g btn-sm" id="cjCopyTeam_'+team.id+'">📋 Copy</button>':'')+
            '</div>'+
          '</div>'+
          (memberCount===0
            ? '<div style="font-size:12px;color:var(--t3);text-align:center;padding:10px 0;">No members yet</div>'
            : '<div style="display:flex;flex-direction:column;gap:4px;">'+
                members.map(function(m,i){
                  return '<div style="display:flex;align-items:center;gap:10px;padding:6px 8px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid rgba(255,255,255,.06);">'+
                    '<span style="font-size:11px;font-weight:800;color:var(--t3);width:16px;text-align:right;">'+(i+1)+'.</span>'+
                    '<span style="font-size:13px;font-weight:600;">'+escHtml(m.player_name)+'</span>'+
                  '</div>';
                }).join('')+
              '</div>')+
        '</div>';
    });
  });

  el.innerHTML=html;

  // Alliance picker change
  var alSel=el.querySelector('#cjAllianceSel');
  if(alSel) alSel.addEventListener('change',function(){ CJ_VIEW_ALLIANCE=this.value==='__all__'?null:this.value; render(); });

  // Copy single team
  el.querySelectorAll('[id^="cjCopyTeam_"]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var tid=btn.id.replace('cjCopyTeam_','');
      var team=CJ_TEAMS.find(function(t){ return t.id===tid; });
      if(!team) return;
      var members=CJ_MEMBERS.filter(function(m){ return m.team_id===tid; }).sort(function(a,b){ return a.position-b.position; });
      var text='👥 '+team.team_name+' ('+members.length+'/6)\n'+'─'.repeat(20)+'\n'+
        members.map(function(m,i){ return (i+1)+'. '+m.player_name; }).join('\n');
      navigator.clipboard.writeText(text).then(function(){ toast('✅ Team copied!'); });
    });
  });

  // Copy all teams per alliance
  alKeys.forEach(function(al){
    var btn=el.querySelector('#cjCopyAll_'+al);
    if(!btn) return;
    btn.addEventListener('click',function(){
      var alTeams=grouped[al];
      var lines=['🤪 CRAZY JOE — '+al,'━'.repeat(24),''];
      alTeams.forEach(function(team){
        var members=CJ_MEMBERS.filter(function(m){ return m.team_id===team.id; }).sort(function(a,b){ return a.position-b.position; });
        lines.push('👥 '+team.team_name+' ('+members.length+'/6)');
        members.forEach(function(m,i){ lines.push('  '+(i+1)+'. '+m.player_name); });
        lines.push('');
      });
      navigator.clipboard.writeText(lines.join('\n')).then(function(){ toast('✅ All teams copied!'); });
    });
  });
}

function renderCjAdmin(el, isSuper, myAlliance){
  // Admin sees only their alliance teams (super sees all)
  var myTeams = isSuper ? CJ_TEAMS : CJ_TEAMS.filter(function(t){ return t.alliance===myAlliance; });

  // My alliance players from DB (for picker)
  var alliancePlayers = isSuper ? ALL_PLAYERS : ALL_PLAYERS.filter(function(p){
    return p.alliance && p.alliance.toLowerCase()===(myAlliance||'').toLowerCase();
  });

  var teamListHtml = myTeams.length===0
    ? '<div class="empty" style="padding:20px 0;"><div class="empty-icon">👥</div><p>No teams yet. Create your first team below.</p></div>'
    : myTeams.map(function(team){
        var members = CJ_MEMBERS.filter(function(m){ return m.team_id===team.id; }).sort(function(a,b){ return a.position-b.position; });
        return '<div class="card" style="margin-bottom:10px;">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'+
            '<div>'+
              '<div style="font-size:13px;font-weight:800;">'+escHtml(team.team_name)+'</div>'+
              (isSuper?'<div style="font-size:10px;color:var(--t3);">'+team.alliance+'</div>':'')+
            '</div>'+
            '<div style="display:flex;gap:6px;">'+
              '<button class="btn btn-g btn-sm cjEditTeamBtn" data-id="'+team.id+'" style="font-size:11px;">✏️ Edit</button>'+
              '<button class="btn btn-d btn-sm cjDelTeamBtn" data-id="'+team.id+'" style="font-size:11px;">🗑</button>'+
            '</div>'+
          '</div>'+
          '<div style="font-size:11px;color:var(--t3);">'+members.length+'/6 members — '+
            (members.length?members.map(function(m){ return m.player_name; }).join(', '):'Empty')+
          '</div>'+
        '</div>';
      }).join('');

  // Alliance selector for super admin when creating
  var superAlSelect = isSuper
    ? '<div class="field"><label class="lbl">Alliance</label>'+
        '<input class="inp" id="cjFormAlliance" placeholder="Alliance name (e.g. BST)" value="'+(CJ_VIEW_ALLIANCE&&CJ_VIEW_ALLIANCE!=='__all__'?CJ_VIEW_ALLIANCE:'')+'" autocomplete="off">'+
      '</div>'
    : '';

  // Member builder
  var memberRows = '';
  for(var i=1;i<=6;i++){
    // DB player options for this alliance
    var pOpts = '<option value="">— Select from roster —</option>'+
      alliancePlayers.map(function(p){ return '<option value="'+escHtml(p.name)+'">'+escHtml(p.name)+(p.alliance?' ['+p.alliance+']':'')+'</option>'; }).join('');
    memberRows +=
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;" id="cjMemberRow_'+i+'">'+
        '<span style="font-size:11px;font-weight:800;color:var(--t3);width:14px;flex-shrink:0;">'+i+'.</span>'+
        '<select class="sel" id="cjMemberSel_'+i+'" style="flex:1;font-size:12px;">'+pOpts+'</select>'+
        '<input class="inp" id="cjMemberMan_'+i+'" placeholder="or type name" style="flex:1;font-size:12px;" autocomplete="off">'+
      '</div>';
  }

  el.innerHTML=
    '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:rgba(230,213,180,.45);margin-bottom:10px;">Current Teams</div>'+
    teamListHtml+
    '<div style="height:1px;background:rgba(255,255,255,.07);margin:16px 0;"></div>'+
    '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:rgba(230,213,180,.45);margin-bottom:10px;" id="cjFormTitle">➕ Add New Team</div>'+
    '<div id="cjFormCard" class="card" style="margin-bottom:12px;">'+
      superAlSelect+
      '<div class="field"><label class="lbl">Team Name</label>'+
        '<input class="inp" id="cjTeamName" placeholder="e.g. Team Alpha" autocomplete="off">'+
      '</div>'+
      '<div class="field">'+
        '<label class="lbl">Members <span style="font-size:10px;color:var(--t3);font-weight:500;">(select from roster or type manually)</span></label>'+
        memberRows+
      '</div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button class="btn btn-p" id="cjSaveTeam" style="flex:1;">Save Team</button>'+
        '<button class="btn btn-g" id="cjCancelEdit" style="display:none;flex:1;">Cancel</button>'+
      '</div>'+
      '<div class="err" id="cjFormErr"></div>'+
    '</div>';

  // Bind edit/delete
  el.querySelectorAll('.cjEditTeamBtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      var tid=btn.dataset.id;
      var team=CJ_TEAMS.find(function(t){ return t.id===tid; });
      if(!team) return;
      CJ_EDIT_TEAM=team;
      document.getElementById('cjFormTitle').textContent='✏️ Edit Team';
      document.getElementById('cjTeamName').value=team.team_name;
      if(isSuper&&document.getElementById('cjFormAlliance')) document.getElementById('cjFormAlliance').value=team.alliance||'';
      document.getElementById('cjCancelEdit').style.display='';
      // Fill members
      var members=CJ_MEMBERS.filter(function(m){ return m.team_id===tid; }).sort(function(a,b){ return a.position-b.position; });
      for(var i=1;i<=6;i++){
        var m=members[i-1];
        var selEl=document.getElementById('cjMemberSel_'+i);
        var manEl=document.getElementById('cjMemberMan_'+i);
        if(!m){ if(selEl) selEl.value=''; if(manEl) manEl.value=''; continue; }
        // Check if name matches a roster option
        var matchOpt=selEl?Array.from(selEl.options).find(function(o){ return o.value===m.player_name; }):null;
        if(matchOpt){ selEl.value=m.player_name; if(manEl) manEl.value=''; }
        else { if(selEl) selEl.value=''; if(manEl) manEl.value=m.player_name; }
      }
      document.getElementById('cjFormCard').scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  el.querySelectorAll('.cjDelTeamBtn').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var tid=btn.dataset.id;
      var team=CJ_TEAMS.find(function(t){ return t.id===tid; });
      if(!team) return;
      if(!await confirmDanger('Delete team "'+team.team_name+'"? This cannot be undone.',{title:'Delete team',confirmLabel:'Delete team'})) return;
      btn.disabled=true;
      await sb.from('cj_team_members').delete().eq('team_id',tid);
      await sb.from('cj_teams').delete().eq('id',tid);
      CJ_TEAMS=CJ_TEAMS.filter(function(t){ return t.id!==tid; });
      CJ_MEMBERS=CJ_MEMBERS.filter(function(m){ return m.team_id!==tid; });
      toast('✅ Team deleted.');
      renderCjAdmin(el, isSuper, myAlliance);
    });
  });

  document.getElementById('cjCancelEdit').addEventListener('click',function(){
    CJ_EDIT_TEAM=null;
    document.getElementById('cjFormTitle').textContent='➕ Add New Team';
    document.getElementById('cjTeamName').value='';
    for(var i=1;i<=6;i++){
      var s=document.getElementById('cjMemberSel_'+i); if(s) s.value='';
      var m=document.getElementById('cjMemberMan_'+i); if(m) m.value='';
    }
    if(isSuper&&document.getElementById('cjFormAlliance')) document.getElementById('cjFormAlliance').value='';
    document.getElementById('cjCancelEdit').style.display='none';
    document.getElementById('cjFormTitle').textContent='➕ Add New Team';
  });

  // When a roster select changes, clear the manual input and vice versa
  for(var i=1;i<=6;i++){
    (function(idx){
      var selEl=document.getElementById('cjMemberSel_'+idx);
      var manEl=document.getElementById('cjMemberMan_'+idx);
      if(selEl) selEl.addEventListener('change',function(){ if(this.value&&manEl) manEl.value=''; });
      if(manEl) manEl.addEventListener('input',function(){ if(this.value.trim()&&selEl) selEl.value=''; });
    })(i);
  }

  document.getElementById('cjSaveTeam').addEventListener('click',async function(){
    var saveBtn=this;
    var teamName=document.getElementById('cjTeamName').value.trim();
    var alliance=isSuper?(document.getElementById('cjFormAlliance')?document.getElementById('cjFormAlliance').value.trim().toUpperCase():''):myAlliance;
    var errEl=document.getElementById('cjFormErr');
    errEl.textContent='';

    if(!teamName){ errEl.textContent='Team name is required.'; return; }
    if(!alliance){ errEl.textContent='Alliance is required.'; return; }

    // Collect members (priority: manual input > select)
    var members=[];
    for(var i=1;i<=6;i++){
      var manEl=document.getElementById('cjMemberMan_'+i);
      var selEl=document.getElementById('cjMemberSel_'+i);
      var name=(manEl&&manEl.value.trim())||(selEl&&selEl.value)||'';
      if(name) members.push({name:name,pos:members.length+1});
    }

    saveBtn.disabled=true; saveBtn.textContent='Saving...';

    try{
      var teamId;
      if(CJ_EDIT_TEAM){
        // Update team
        var upd=await sb.from('cj_teams').update({team_name:teamName,alliance:alliance}).eq('id',CJ_EDIT_TEAM.id).select().single();
        if(upd.error) throw upd.error;
        teamId=CJ_EDIT_TEAM.id;
        CJ_TEAMS=CJ_TEAMS.map(function(t){ return t.id===teamId?upd.data:t; });
        // Delete old members
        await sb.from('cj_team_members').delete().eq('team_id',teamId);
        CJ_MEMBERS=CJ_MEMBERS.filter(function(m){ return m.team_id!==teamId; });
      } else {
        // Insert team
        var ins=await sb.from('cj_teams').insert({team_name:teamName,alliance:alliance}).select().single();
        if(ins.error) throw ins.error;
        teamId=ins.data.id;
        CJ_TEAMS.push(ins.data);
      }

      // Insert members
      if(members.length){
        var mRows=members.map(function(m){ return {team_id:teamId,player_name:m.name,position:m.pos}; });
        var mIns=await sb.from('cj_team_members').insert(mRows).select();
        if(mIns.error) throw mIns.error;
        CJ_MEMBERS=CJ_MEMBERS.concat(mIns.data);
      }

      CJ_EDIT_TEAM=null;
      toast('✅ Team saved!');
      renderCjAdmin(el, isSuper, myAlliance);
    } catch(e){
      errEl.textContent='Error: '+(e.message||'Unknown error');
    } finally {
      saveBtn.disabled=false; saveBtn.textContent='Save Team';
    }
  });
}

// Pure client-side rally-sync calculator. No Supabase, no roles.
// delay = maxMarch - playerMarch ; remaining = duration - delay

function rtLoad(){
  if(RT_LOADED) return;
  RT_LOADED=true;
  try{
    var s=JSON.parse(localStorage.getItem('rally-timer-v1')||'null');
    if(s&&typeof s==='object'){
      if(Array.isArray(s.leaders)) RT_LEADERS=s.leaders.map(function(l){ return {name:String(l&&l.name||''),march:String(l&&l.march||''),active:!(l&&l.active===false)}; });
      if([60,180,300].indexOf(s.dur)>=0) RT_DUR=s.dur;
    }
  }catch(e){}
  if(!RT_LEADERS.length) RT_LEADERS=[{name:'',march:'',active:true},{name:'',march:'',active:true}];
}
function rtSave(){
  try{ localStorage.setItem('rally-timer-v1',JSON.stringify({leaders:RT_LEADERS,dur:RT_DUR})); }catch(e){}
}
// Presets live in Supabase (rally_timer_presets), shared by every rally admin.
async function rtLoadPresets(){
  if(RT_PRESETS_LOADED) return;
  RT_PRESETS_LOADED=true;
  try{
    var r=await sb.from('rally_timer_presets').select('*').order('created_at');
    if(!r.error&&Array.isArray(r.data)){
      RT_PRESETS=r.data;
      if(document.getElementById('rtContent')) renderRallyTimerContent();
    }
  }catch(e){}
}
function rtLeadersForPreset(){
  return RT_LEADERS.map(function(l){ return {name:l.name,march:l.march,active:l.active!==false}; });
}
// "72" or "1:12" -> seconds ; null if invalid
function rtParseMarch(str){
  var v=String(str==null?'':str).trim();
  if(!v) return null;
  if(/^\d+$/.test(v)) return parseInt(v,10);
  var m=v.match(/^(\d+):([0-5]?\d)$/);
  if(m) return parseInt(m[1],10)*60+parseInt(m[2],10);
  return null;
}
// seconds -> "M:SS"
function rtMmss(sec){
  sec=Math.max(0,Math.round(sec));
  var m=Math.floor(sec/60), s=sec%60;
  return m+':'+String(s).padStart(2,'0');
}
// valid leaders sorted by march desc (stable on entry order)
function rtCompute(){
  var rows=[];
  RT_LEADERS.forEach(function(l,i){
    if(l.active===false) return; // benched — kept in the roster, excluded from the order
    var march=rtParseMarch(l.march);
    if(march==null) return;
    rows.push({name:(l.name||'').trim()||'Leader '+(i+1),march:march,idx:i});
  });
  if(!rows.length) return [];
  rows.sort(function(a,b){ return (b.march-a.march)||(a.idx-b.idx); });
  var maxMarch=rows[0].march;
  return rows.map(function(r,rank){
    var delay=maxMarch-r.march;
    return {name:r.name,rank:rank,delay:delay,remaining:Math.max(0,RT_DUR-delay),tooSlow:delay>RT_DUR};
  });
}
function rtBuildText(){
  var rows=rtCompute();
  if(!rows.length) return 'Add rally leaders and their march times to see the opening order.';
  var out="Rally pick order ("+rtMmss(RT_DUR)+"):\n";
  out+=rows.map(function(r){
    var line=(r.rank+1)+'. '+r.name+' - '+rtMmss(r.remaining);
    if(r.rank===0) line+=' GO';
    else line+=' ('+r.delay+'s after)';
    if(r.tooSlow) line+=' ⚠ too slow';
    return line;
  }).join('\n');
  return out;
}
function rtUpdateResult(){
  var el=document.getElementById('rtResult');
  if(el) el.textContent=rtBuildText();
}

// Live-caps each percent field against the other two so their sum can
// never exceed 100 while typing (Save-time validation stays as a
// backstop, matching the DB CHECK constraint).
function bindFormationFields(prefix){
  var infEl=document.getElementById(prefix+'Inf'), lanEl=document.getElementById(prefix+'Lan'), marEl=document.getElementById(prefix+'Mar');
  var lbl=document.getElementById(prefix+'SumLbl');
  if(!infEl||!lanEl||!marEl||!lbl) return;
  var fields=[infEl,lanEl,marEl];
  function refresh(changed){
    if(changed){
      var others=fields.filter(function(f){ return f!==changed; }).reduce(function(s,f){ return s+(parseInt(f.value)||0); },0);
      var maxAllowed=Math.max(0,100-others);
      if((parseInt(changed.value)||0)>maxAllowed) changed.value=maxAllowed;
    }
    fields.forEach(function(f){
      var others=fields.filter(function(x){ return x!==f; }).reduce(function(s,x){ return s+(parseInt(x.value)||0); },0);
      f.max=Math.max(0,100-others);
    });
    var sum=fields.reduce(function(s,f){ return s+(parseInt(f.value)||0); },0);
    lbl.textContent=sum+'%';
    lbl.style.color=sum===100?'var(--green)':'var(--red)';
  }
  fields.forEach(function(f){ f.addEventListener('input',function(){ refresh(f); }); });
  refresh(null);
}

function formationSum(prefix){
  var inf=parseInt(document.getElementById(prefix+'Inf').value)||0;
  var lan=parseInt(document.getElementById(prefix+'Lan').value)||0;
  var mar=parseInt(document.getElementById(prefix+'Mar').value)||0;
  return inf+lan+mar;
}

// Renders the dynamic (add/remove) squad-member rows from WAR_EDIT_MEMBERS
// into #warMemberRows, and (re)binds roster-select/manual-entry mutual
// exclusion. Members only pick heroes (no percent — they follow the
// team's single ratio), so there's no per-row validation to bind here.
// Cycling accent palette (hex + matching rgb triplet for tint backgrounds)
// so consecutive squad rows read as visually distinct blocks instead of
// one repeated card — see feedback on the all-identical-rows screenshot.
var WAR_MEMBER_ROW_COLORS=[
  {hex:'#c9974b',rgb:'201,151,75'},
  {hex:'#7a9c72',rgb:'122,156,114'},
  {hex:'#8f7aa8',rgb:'143,122,168'},
  {hex:'#a3b3c2',rgb:'163,179,194'},
  {hex:'#c17a45',rgb:'193,122,69'},
  {hex:'#b5554a',rgb:'181,85,74'}
];

function renderWarMemberRows(){
  var wrap=document.getElementById('warMemberRows');
  if(!wrap) return;
  wrap.innerHTML = WAR_EDIT_MEMBERS.map(function(m,idx){
    var prefix='warMem_'+idx;
    var isManual = m.player_name && !ALL_PLAYERS.some(function(p){ return p.name===m.player_name; });
    var pOpts='<option value="">— Select from roster —</option>'+
      ALL_PLAYERS.map(function(p){
        return '<option value="'+escHtml(p.name)+'"'+(!isManual&&p.name===m.player_name?' selected':'')+'>'+escHtml(p.name)+(p.alliance?' ['+p.alliance+']':'')+'</option>';
      }).join('');
    var c=WAR_MEMBER_ROW_COLORS[idx%WAR_MEMBER_ROW_COLORS.length];
    return '<div class="card" style="margin-bottom:8px;padding:10px;border-left:3px solid '+c.hex+';" data-mem-idx="'+idx+'">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">'+
        '<span style="font-size:11px;font-weight:800;color:'+c.hex+';background:rgba('+c.rgb+',.18);width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;">'+(idx+1)+'</span>'+
        '<select class="sel" id="'+prefix+'Sel" style="flex:1;font-size:12px;">'+pOpts+'</select>'+
        '<input class="inp" id="'+prefix+'Man" placeholder="or type name" value="'+(isManual?escHtml(m.player_name):'')+'" style="flex:1;font-size:12px;" autocomplete="off">'+
        '<button class="btn btn-d btn-sm warRemoveMember" data-idx="'+idx+'" style="flex-shrink:0;">✕</button>'+
      '</div>'+
      renderMemberHeroFields(prefix, m)+
    '</div>';
  }).join('');

  WAR_EDIT_MEMBERS.forEach(function(m,idx){
    var prefix='warMem_'+idx;
    var selEl=document.getElementById(prefix+'Sel');
    var manEl=document.getElementById(prefix+'Man');
    if(selEl) selEl.addEventListener('change',function(){ if(this.value&&manEl) manEl.value=''; });
    if(manEl) manEl.addEventListener('input',function(){ if(this.value.trim()&&selEl) selEl.value=''; });
  });

  wrap.querySelectorAll('.warRemoveMember').forEach(function(btn){
    btn.addEventListener('click',function(){
      WAR_EDIT_MEMBERS.splice(parseInt(btn.dataset.idx),1);
      renderWarMemberRows();
    });
  });
}

function loadWarTeamIntoForm(team){

  document.getElementById('warFormAlliance').value=team.alliance||'';

// Duplicate Team: source rows are already in memory (loaded via loadAll()),
// so this is a pure client-side clone into the create-form — no Supabase
// round-trip happens until the admin actually clicks Save on the
// pre-filled, renamed "(Copy)" team. Forces a rename before persisting,
// avoiding duplicate-named teams.
function duplicateWarTeam(teamId){
  var team=WAR_TEAMS.find(function(t){ return t.id===teamId; });
  if(!team) return;
  var members=WAR_MEMBERS.filter(function(m){ return m.team_id===teamId; }).sort(function(a,b){ return a.position-b.position; });

  WAR_TAB='admin';
  WAR_EDIT_TEAM=null; // null => Save will INSERT a new row, not UPDATE
  WAR_EDIT_MEMBERS=members.map(function(m){
    return {player_name:m.player_name,hero1:m.hero1,hero2:m.hero2,hero3:m.hero3};
  });
  render(); // rebuild the module DOM with a fresh (empty) admin form

  document.getElementById('warFormTitle').textContent='➕ Add New Team';
  document.getElementById('warTeamName').value=team.team_name+' (Copy)';
  document.getElementById('warFormAlliance').value=team.alliance||'';
  document.getElementById('warLeaderSel').value=team.leader_name||'';
  document.getElementById('warTypeSel').value=team.formation_type||'Attack';
  updateFormationTypeStyle();
  setFormationFields('warTeam', {hero1:team.hero1,hero2:team.hero2,hero3:team.hero3,infantry_pct:team.infantry_pct,lancer_pct:team.lancer_pct,marksman_pct:team.marksman_pct});
  renderWarMemberRows();
  document.getElementById('warFormCard').scrollIntoView({behavior:'smooth',block:'start'});
  toast('Duplicated — rename and Save to create the new team.');
}

    teamListHtml+
    '<div style="height:1px;background:rgba(255,255,255,.07);margin:16px 0;"></div>'+
    '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:rgba(230,213,180,.45);margin-bottom:10px;" id="warFormTitle">➕ Add New Team</div>'+
    '<div id="warFormCard" class="card" style="margin-bottom:12px;">'+
      '<div class="field"><label class="lbl">Team Name</label>'+
        '<input class="inp" id="warTeamName" placeholder="e.g. Rally Alpha" autocomplete="off">'+

      '<div class="field"><label class="lbl">Alliance</label>'+
        '<input class="inp" id="warFormAlliance" placeholder="Alliance name (e.g. BST)" autocomplete="off">'+
      '</div>'+
      '<div class="field"><label class="lbl">Rally Leader</label>'+
        '<select class="sel" id="warLeaderSel">'+
          '<option value="">— Select from roster —</option>'+
          ALL_PLAYERS.map(function(p){ return '<option value="'+escHtml(p.name)+'">'+escHtml(p.name)+(p.alliance?' ['+p.alliance+']':'')+'</option>'; }).join('')+
        '</select>'+

        '<select class="sel" id="warTypeSel">'+

          '<option value="Defense">🛡️ Defense</option>'+

        '<button class="btn btn-g btn-sm" id="warAddMemberBtn" style="margin-top:6px;">➕ Add Squad Member</button>'+

  el.querySelectorAll('.warDelTeamBtn').forEach(function(btn){

      var team=WAR_TEAMS.find(function(t){ return t.id===btn.dataset.id; });
      if(!team) return;
      if(!await confirmDanger('Delete team "'+team.team_name+'"? This cannot be undone.',{title:'Delete team',confirmLabel:'Delete team'})) return;
      btn.disabled=true;
      var tid=team.id;
      await sb.from('war_team_members').delete().eq('team_id',tid);
      await sb.from('war_teams').delete().eq('id',tid);
      WAR_TEAMS=WAR_TEAMS.filter(function(t){ return t.id!==tid; });

      toast('✅ Team deleted.');

    WAR_EDIT_MEMBERS.push({player_name:'',hero1:null,hero2:null,hero3:null});
    renderWarMemberRows();
  });

  document.getElementById('warSaveTeam').addEventListener('click',async function(){
    var saveBtn=this;
    var teamName=document.getElementById('warTeamName').value.trim();
    var alliance=document.getElementById('warFormAlliance').value.trim().toUpperCase();
    var leaderName=document.getElementById('warLeaderSel').value;
    var formationType=document.getElementById('warTypeSel').value;
    var errEl=document.getElementById('warFormErr');
    errEl.textContent='';

    if(!teamName){ errEl.textContent='Team name is required.'; return; }
    if(!alliance){ errEl.textContent='Alliance is required.'; return; }
    if(!leaderName){ errEl.textContent='Rally leader is required.'; return; }
    if(formationSum('warTeam')!==100){ errEl.textContent='Formation percentages must sum to 100%.'; return; }

    var members=[];
    var memberRowEls=el.querySelectorAll('#warMemberRows [data-mem-idx]');
    for(var i=0;i<memberRowEls.length;i++){
      var idx=memberRowEls[i].dataset.memIdx;
      var prefix='warMem_'+idx;
      var nameSel=document.getElementById(prefix+'Sel');
      var nameMan=document.getElementById(prefix+'Man');
      var name=(nameMan&&nameMan.value.trim())||(nameSel&&nameSel.value)||'';
      if(!name){ errEl.textContent='Squad member #'+(i+1)+' needs a player.'; return; }
      var h=readMemberHeroes(prefix);
      h.player_name=name; h.position=i+1;
      members.push(h);
    }

    saveBtn.disabled=true; saveBtn.textContent='Saving...';
    try{
      var f=readFormation('warTeam');
      var teamRow={
        team_name:teamName, alliance:alliance, leader_name:leaderName, formation_type:formationType,
        hero1:f.hero1, hero2:f.hero2, hero3:f.hero3,
        infantry_pct:f.infantry_pct, lancer_pct:f.lancer_pct, marksman_pct:f.marksman_pct
      };
      var teamId;
      if(WAR_EDIT_TEAM){
        var upd=await sb.from('war_teams').update(teamRow).eq('id',WAR_EDIT_TEAM.id).select().single();
        if(upd.error) throw upd.error;
        teamId=WAR_EDIT_TEAM.id;
        WAR_TEAMS=WAR_TEAMS.map(function(t){ return t.id===teamId?upd.data:t; });
        await sb.from('war_team_members').delete().eq('team_id',teamId);
        WAR_MEMBERS=WAR_MEMBERS.filter(function(m){ return m.team_id!==teamId; });
      } else {
        teamRow.created_by=SESSION.name;
        var ins=await sb.from('war_teams').insert(teamRow).select().single();
        if(ins.error) throw ins.error;
        teamId=ins.data.id;
        WAR_TEAMS.push(ins.data);
      }

      if(members.length){
        var mRows=members.map(function(m){
          return {team_id:teamId, player_name:m.player_name, position:m.position,
            hero1:m.hero1, hero2:m.hero2, hero3:m.hero3};
        });
        var mIns=await sb.from('war_team_members').insert(mRows).select();
        if(mIns.error) throw mIns.error;
        WAR_MEMBERS=WAR_MEMBERS.concat(mIns.data);
      }

      WAR_EDIT_TEAM=null; WAR_EDIT_MEMBERS=[];
      toast('✅ Team saved!');
      renderWarAdmin(el, isAdm);
    } catch(e){
      errEl.textContent='Error: '+(e.message||'Unknown error');
    } finally {
      saveBtn.disabled=false; saveBtn.textContent='Save Team';
    }
  });
}

function heroInUse(heroId){
  return WAR_TEAMS.some(function(t){ return [t.hero1,t.hero2,t.hero3].indexOf(heroId)>=0; })
    || WAR_MEMBERS.some(function(m){ return [m.hero1,m.hero2,m.hero3].indexOf(heroId)>=0; });
}
function countHeroUsage(heroId){
  var count=0;
  WAR_TEAMS.forEach(function(t){ if([t.hero1,t.hero2,t.hero3].indexOf(heroId)>=0) count++; });
  WAR_MEMBERS.forEach(function(m){ if([m.hero1,m.hero2,m.hero3].indexOf(heroId)>=0) count++; });
  return count;
}

  if(newBtn) newBtn.addEventListener('click',function(){ WAR_EDIT_HERO={}; renderWarHeroesAdmin(el); });

  var cancelBtn=document.getElementById('warHeroCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click',function(){ WAR_EDIT_HERO=undefined; renderWarHeroesAdmin(el); });

  var saveBtn=document.getElementById('warHeroSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click',async function(){
    var name=document.getElementById('warHeroName').value.trim();
    var cls=document.getElementById('warHeroClass').value;
    var errEl=document.getElementById('warHeroFormErr');
    if(!name){ errEl.textContent='Name is required.'; return; }
    saveBtn.disabled=true; saveBtn.textContent='Saving...';
    if(WAR_EDIT_HERO&&WAR_EDIT_HERO.id){
      var r=await sb.from('war_heroes').update({name:name,class:cls}).eq('id',WAR_EDIT_HERO.id).select().single();
      if(r.error){ errEl.textContent='Error: '+r.error.message; saveBtn.disabled=false; saveBtn.textContent='Save Changes'; return; }
      WAR_HEROES=WAR_HEROES.map(function(x){ return x.id===r.data.id?r.data:x; });
    } else {
      var r=await sb.from('war_heroes').insert({name:name,class:cls}).select().single();
      if(r.error){ errEl.textContent='Error: '+r.error.message; saveBtn.disabled=false; saveBtn.textContent='Add Hero'; return; }
      WAR_HEROES.push(r.data);
    }
    WAR_EDIT_HERO=undefined; toast('✅ Saved!'); renderWarHeroesAdmin(el);
  });

  el.querySelectorAll('.warHeroEditBtn').forEach(function(btn){
    btn.addEventListener('click',function(){
      WAR_EDIT_HERO=WAR_HEROES.find(function(h){ return h.id===btn.dataset.id; });
      renderWarHeroesAdmin(el);
    });
  });

  el.querySelectorAll('.warHeroDelBtn').forEach(function(btn){
    btn.addEventListener('click',async function(){
      var hid=btn.dataset.id;
      var h=WAR_HEROES.find(function(x){ return x.id===hid; });
      if(!h) return;
      if(heroInUse(hid)){
        toast('⚠️ '+h.name+' is used in '+countHeroUsage(hid)+' formation(s) — remove them first.');
        return;
      }
      if(!await confirmDanger('Delete hero "'+h.name+'" from the roster?',{title:'Delete hero',confirmLabel:'Delete'})) return;
      var r=await sb.from('war_heroes').delete().eq('id',hid);
      if(r.error){ toast('Error: '+r.error.message); return; }
      WAR_HEROES=WAR_HEROES.filter(function(x){ return x.id!==hid; });
      toast('🗑 Deleted'); renderWarHeroesAdmin(el);
    });
  });
}

// ── PWA: SERVICE WORKER + PUSH ─────────────────────────────
const VAPID_PUBLIC = 'BJuz8Z1iiGP-hz1G5gUw2Uibj7H4rwEkCyCd40yLWa7-tfRab77t1W3fh3eEr77VeF1PgLkyj77QnnNu0BflEyY';

function urlB64ToUint8(b){
  var pad='='.repeat((4-b.length%4)%4);
  var raw=atob((b+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return new Uint8Array([].map.call(raw,function(c){ return c.charCodeAt(0); }));
}

function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream; }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone; }

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/State-2901/sw.js',{scope:'/State-2901/'})
    .then(function(reg){ window._swReg=reg; })
    .catch(function(e){ console.warn('SW failed:',e); });
}

async function subscribePush(){
  if(!window._swReg||!SESSION) return false;
  try{
    var existing=await window._swReg.pushManager.getSubscription();
    if(existing){ await savePushSub(existing); return true; }
    var sub=await window._swReg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)
    });
    await savePushSub(sub);
    return true;
  }catch(e){ console.warn('Push sub failed:',e); return false; }
}

async function savePushSub(sub){
  if(!SESSION) return;
  var r=await sb.from('push_subscriptions').upsert({
    player_name: SESSION.name,
    endpoint:    sub.endpoint,
    subscription: sub.toJSON()
  },{onConflict:'endpoint'});
  if(r.error) console.warn('Push subscription save failed:',r.error.message);
}

async function requestPushPermission(){
  if(!('Notification' in window)) return 'unsupported';
  if(Notification.permission==='granted'){ await subscribePush(); return 'granted'; }
  if(Notification.permission==='denied') return 'denied';
  var perm=await Notification.requestPermission();
  if(perm==='granted') await subscribePush();
  return perm;
}
